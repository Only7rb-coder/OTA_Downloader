name: Extract boot and init_boot images

on:
  workflow_dispatch:
    inputs:
      ota_url:
        description: 'SourceForge or direct URL for a .tar.zst OTA image archive'
        required: true
        type: string
      output_name:
        description: 'Artifact name (letters, numbers, dot, underscore, and hyphen only)'
        required: false
        default: ota-boot-images
        type: string

permissions:
  contents: read

jobs:
  extract-images:
    name: Download and extract boot images
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OTA_URL: ${{ inputs.ota_url }}
      OUTPUT_NAME: ${{ inputs.output_name }}

    steps:
      - name: Install archive tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y aria2 curl file jq tar zstd zip

      - name: Download OTA image archive
        run: |
          set -euo pipefail
          mkdir -p workspace

          if [[ ! "$OTA_URL" =~ ^https:// ]]; then
            echo "OTA URL must use HTTPS."
            exit 1
          fi

          # SourceForge's download endpoint can return 403 to aria2 during the
          # redirect step. Resolve its signed mirror URL with curl first, then
          # give that final URL to aria2 for parallel ranged connections.
          DOWNLOAD_URL="$OTA_URL"
          if ! DOWNLOAD_URL=$(curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --head \
            --max-redirs 10 \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --user-agent 'Mozilla/5.0' \
            --output /dev/null \
            --write-out '%{url_effective}' \
            "$OTA_URL"); then
            echo "Could not resolve a final download URL; aria2 will try the original URL."
          fi

          if ! aria2c \
            --allow-overwrite=false \
            --auto-file-renaming=false \
            --check-certificate=true \
            --connect-timeout=30 \
            --continue=true \
            --console-log-level=notice \
            --disk-cache=64M \
            --enable-http-pipelining=true \
            --file-allocation=none \
            --max-connection-per-server=16 \
            --max-concurrent-downloads=1 \
            --max-tries=20 \
            --min-split-size=4M \
            --optimize-concurrent-downloads=true \
            --out=ota_images.tar.zst \
            --dir=workspace \
            --retry-wait=5 \
            --split=16 \
            --summary-interval=10 \
            --timeout=30 \
            --user-agent='Mozilla/5.0' \
            --referer="$OTA_URL" \
            "$DOWNLOAD_URL"; then
            echo "aria2c could not complete the download; retrying with curl."
            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --continue-at - \
              --output workspace/ota_images.tar.zst \
              "$OTA_URL"
          fi

          if ! file workspace/ota_images.tar.zst | grep -Eiq 'zstandard|zstd'; then
            echo "Downloaded file is not recognized as a Zstandard archive:"
            file workspace/ota_images.tar.zst
            exit 1
          fi

          echo "Downloaded archive: $(du -h workspace/ota_images.tar.zst | cut -f1)"

      - name: Extract boot.img and init_boot.img
        run: |
          set -euo pipefail
          mkdir -p workspace/extracted_images
          OUTPUT_DIR="$PWD/workspace/extracted_images"
          export OUTPUT_DIR

          # Stream the compressed tar archive and select boot-named members,
          # even when they are nested below a device/version directory. This
          # avoids unpacking the complete archive onto the runner disk. Select
          # all *boot.img members in one pass; the command writes only exact
          # boot.img and init_boot.img basenames, so a missing init_boot.img
          # does not make tar fail.
          tar \
            --use-compress-program='zstd -d -q' \
            --extract \
            --file workspace/ota_images.tar.zst \
            --directory workspace/extracted_images \
            --wildcards \
            --no-anchored \
            --no-same-owner \
            --no-same-permissions \
            --to-command='case "$TAR_FILENAME" in
              */boot.img|boot.img) cat > "$OUTPUT_DIR/boot.img" ;;
              */init_boot.img|init_boot.img) cat > "$OUTPUT_DIR/init_boot.img" ;;
            esac' \
            -- '*boot.img'

          found=0
          for image in boot.img init_boot.img; do
            if [[ -s "workspace/extracted_images/$image" ]]; then
              printf '%s: %s\n' "$image" "$(du -h "workspace/extracted_images/$image" | cut -f1)"
              found=$((found + 1))
            else
              echo "Warning: $image was not found in the archive."
            fi
          done

          if [[ "$found" -eq 0 ]]; then
            echo "Neither boot.img nor init_boot.img was found in the archive."
            exit 1
          fi

      - name: Package extracted images
        run: |
          set -euo pipefail

          if [[ -z "$OUTPUT_NAME" || ! "$OUTPUT_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "output_name may contain only letters, numbers, dot, underscore, and hyphen."
            exit 1
          fi

          cd workspace/extracted_images
          sha256sum *.img > sha256sums.txt
          zip -9 "../../${OUTPUT_NAME}.zip" *.img sha256sums.txt

      - name: Upload extracted images
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: |
            workspace/extracted_images/*.img
            workspace/extracted_images/sha256sums.txt
            ${{ inputs.output_name }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload output files to Gofile
        env:
          GOFILE_SERVER_API: https://api.gofile.io/servers
          GOFILE_UPLOAD_URL_SUFFIX: .gofile.io/contents/uploadFile
        run: |
          set -euo pipefail

          server_response=$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "$GOFILE_SERVER_API")
          server=$(jq -er '.data.servers[0].name' <<<"$server_response")
          upload_url="https://${server}${GOFILE_UPLOAD_URL_SUFFIX}"

          upload_file() {
            local file="$1"
            local response
            local link

            echo "Uploading $file to $upload_url"
            response=$(curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              -F "file=@${file}" \
              "$upload_url")
            link=$(jq -er '.data.downloadPage' <<<"$response")

            echo "Gofile link for $(basename "$file"): $link"
            printf -- '- `%s`: %s\n' "$(basename "$file")" "$link" >> "$GITHUB_STEP_SUMMARY"
          }

          upload_file "${OUTPUT_NAME}.zip"
          for image in workspace/extracted_images/*.img; do
            [[ -f "$image" ]] && upload_file "$image"
          done
